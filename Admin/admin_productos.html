<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrar Productos - Objetivo Café</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/colores.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Panel de Administración</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">Administrar Productos</h2>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio Actual</th>
          <th>Nuevo Precio</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tablaProductos"></tbody>
    </table>
  </div>

  <script src="../js/productos.js"></script>
  <script>
    const productos = obtenerProductos();
    const tabla = document.getElementById("tablaProductos");

    function cargarProductos() {
      tabla.innerHTML = "";
      productos.forEach(p => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td>${p.id}</td>
          <td>${p.nombre}</td>
          <td>$${p.precio.toLocaleString()}</td>
          <td><input type="number" id="nuevo_${p.id}" class="form-control" value="${p.precio}"></td>
          <td><button class="btn btn-success btn-sm" onclick="actualizarPrecio(${p.id})">Guardar</button></td>
        `;
        tabla.appendChild(fila);
      });
    }

    function actualizarPrecio(id) {
      const nuevoPrecio = parseInt(document.getElementById(`nuevo_${id}`).value);
      const guardados = JSON.parse(localStorage.getItem("productosActualizados")) || {};
      guardados[id] = { precio: nuevoPrecio };
      localStorage.setItem("productosActualizados", JSON.stringify(guardados));
      alert(`Precio actualizado correctamente para el producto ID ${id}`);
      cargarProductos();
    }

    cargarProductos();
  </script>
</body>
</html>
