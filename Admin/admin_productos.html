<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrar Productos - Objetivo Café Admin</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/colores.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Objetivo Café - Admin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a href="admin_resumen.html" class="nav-link"><i class="fas fa-chart-line"></i> Resumen</a></li>
          <li class="nav-item"><a href="admin_productos.html" class="nav-link active"><i class="fas fa-box-open"></i> Productos</a></li>
          <li class="nav-item"><a href="admin_usuarios.html" class="nav-link"><i class="fas fa-users"></i> Usuarios</a></li>
          <li class="nav-item"><a href="admin_ventas.html" class="nav-link"><i class="fas fa-cash-register"></i> Ventas</a></li>
          <li class="nav-item"><a href="../index.html" class="btn btn-sm btn-danger ms-2">Volver</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">Administrar Productos</h2>

    <button class="btn btn-primary mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAgregar" aria-expanded="false" aria-controls="collapseAgregar">
        <i class="fas fa-plus-circle"></i> Agregar Nuevo Producto
    </button>

    <div class="collapse mb-4 p-4 border rounded shadow-sm bg-light" id="collapseAgregar">
        <h4 class="mb-3">Nuevo Producto</h4>
        <form id="formAgregarProducto">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="nuevoNombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nuevoNombre" required>
                </div>
                <div class="col-md-3">
                    <label for="nuevoPrecio" class="form-label">Precio</label>
                    <input type="number" class="form-control" id="nuevoPrecio" min="1" required>
                </div>
                <div class="col-md-3">
                    <label for="nuevoTipo" class="form-label">Tipo</label>
                    <select class="form-select" id="nuevoTipo" required>
                        <option value="cafe">Café</option>
                        <option value="cafetera">Cafetera</option>
                        <option value="accesorio">Accesorio</option>
                    </select>
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-success">Guardar Producto</button>
                </div>
            </div>
        </form>
    </div>

    <div class="table-responsive shadow rounded">
      <table class="table table-striped">
        <thead class="bg-dark text-white">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio Actual</th>
            <th>Nuevo Precio</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </div>
  </div>

    <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/productos.js"></script>
  <script src="../js/productos_funciones.js"></script>
  <script>
    const tabla = document.getElementById("tablaProductos");
    const formAgregar = document.getElementById("formAgregarProducto");

    function cargarProductos() {
        const productos = obtenerProductos(); 
        tabla.innerHTML = "";
        
        productos.forEach(p => {
            const fila = document.createElement("tr");
            fila.innerHTML = `
                <td>${p.id}</td>
                <td>${p.nombre}</td>
                <td>$${p.precio.toLocaleString('es-CL')}</td>
                <td><input type="number" id="nuevo_${p.id}" class="form-control" value="${p.precio}" min="1"></td>
                <td><button class="btn btn-success btn-sm" onclick="handleActualizarPrecio(${p.id})">Guardar</button></td>
            `;
            tabla.appendChild(fila);
        });
    }

    // Lógica de actualización (hacemos la función global para onclick)
    window.handleActualizarPrecio = function(id) {
        const inputElement = document.getElementById(`nuevo_${id}`);
        const nuevoPrecio = parseInt(inputElement.value);

        if (isNaN(nuevoPrecio) || nuevoPrecio <= 0) {
            alert("Por favor, ingresa un precio válido.");
            return;
        }

        // Llama a la función global de productos_funciones.js
        actualizarPrecio(id, nuevoPrecio); 
        alert(`Precio actualizado para el producto ID ${id}`);
        cargarProductos();
    };

    // Lógica para agregar un nuevo producto
    formAgregar.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const nombre = document.getElementById('nuevoNombre').value.trim();
        const precio = parseInt(document.getElementById('nuevoPrecio').value);
        const tipo = document.getElementById('nuevoTipo').value;
        
        if (!nombre || isNaN(precio) || precio <= 0) {
            alert('Por favor, completa el nombre y el precio.');
            return;
        }

        const nuevoProducto = {
            nombre: nombre,
            precio: precio,
            tipo: tipo,
            opciones: (tipo === 'cafe') ? ["Grano entero", "Italiana", "Prensa Francesa", "Filtro"] : [], 
            imagen: `img/${nombre.toLowerCase().replace(/\s/g, '_')}.png`
        };

        // Llama a la función global de productos_funciones.js
        const nuevoId = guardarNuevoProducto(nuevoProducto); 
        
        alert(`Producto "${nombre}" agregado con éxito. ID: ${nuevoId}`);
        document.getElementById('formAgregarProducto').reset();
        
        // Ocultar el formulario (usa la clase de Bootstrap)
        const collapseElement = document.getElementById('collapseAgregar');
        if(new bootstrap.Collapse) new bootstrap.Collapse(collapseElement).hide();

        cargarProductos();
    });

    // Inicializar la tabla al cargar la página
    cargarProductos();
  </script>
</body>
</html>
