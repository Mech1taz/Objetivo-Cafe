<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Ventas</title>
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/colores.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-sm navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Objetivo Café - Admin</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a href="admin_productos.html" class="nav-link">Productos</a></li>
        <li class="nav-item"><a href="admin_usuarios.html" class="nav-link">Usuarios</a></li>
        <li class="nav-item"><a href="admin_ventas.html" class="nav-link active">Ventas</a></li>
        <li class="nav-item"><a href="admin_resumen.html" class="nav-link">Resumen</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-center mb-4">Historial de Ventas</h2>
    <table class="table table-striped">
      <thead class="table-dark">
        <tr>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="tablaVentas"></tbody>
    </table>
  </div>

  <script>
    const ventas = JSON.parse(localStorage.getItem("ultimaCompra")) || [];
    const tabla = document.getElementById("tablaVentas");

    function mostrarVentas() {
      if (ventas.length === 0) {
        tabla.innerHTML = `<tr><td colspan="4">No hay ventas registradas</td></tr>`;
      } else {
        tabla.innerHTML = ventas.map(v => `
          <tr>
            <td>${v.nombre}</td>
            <td>${v.cantidad}</td>
            <td>$${v.precio}</td>
            <td>$${v.precio * v.cantidad}</td>
          </tr>`).join('');
      }
    }

    document.addEventListener("DOMContentLoaded", mostrarVentas);
  </script>
</body>
</html>
